name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      # Tag jen ve tvaru vX.Y.Z (jako winget-manifest.yml) – jinak chyba ještě před buildem.
      # Tag jde do skriptu přes env, ne přímou substitucí (injekce do shellu).
      - name: Check tag and read version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' neodpovídá tvaru vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dirwise ${{ github.ref_name }}
          releaseBody: |
            Download `Dirwise_${{ steps.version.outputs.version }}_x64-setup.exe` below. It installs for the current user only — no admin rights needed.

            The installer is not code-signed, so Windows SmartScreen will warn you.
            Click **More info → Run anyway** to continue.
          releaseDraft: true
          prerelease: false
